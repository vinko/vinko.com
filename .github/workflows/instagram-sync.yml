# Instagram → Astro drafts (Ask-First)
#
# Fetches @vinko Instagram Business/Creator media and writes Markdown drafts.
# Does NOT deploy to www.vinko.com, hosting.vinko.com, or ICDSoft.
# Does NOT set draft: false. GitHub Pages is not published by this workflow.

name: Instagram draft sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test sync helpers
        run: node --test scripts/*.test.mjs

      - name: Check Instagram secrets
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            {
              echo "## Instagram → Astro draft sync"
              echo
              echo "Missing \`INSTAGRAM_ACCESS_TOKEN\`."
              echo
              echo "Add the secret in repo Settings → Secrets and variables → Actions."
              echo "See \`docs/instagram-sync.md\`."
              echo
              echo "This job did not write posts and did **not** deploy to www.vinko.com."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::INSTAGRAM_ACCESS_TOKEN is not set. See docs/instagram-sync.md. No files written; www.vinko.com was not updated."
            exit 1
          fi

      - name: Checkout instagram-drafts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH"
          if git ls-remote --exit-code --heads origin instagram-drafts; then
            git fetch origin instagram-drafts
            git checkout -B instagram-drafts origin/instagram-drafts
            git merge --no-edit "origin/${DEFAULT_BRANCH}"
          else
            git checkout -B instagram-drafts
          fi

      - name: Sync Instagram drafts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/instagram-sync.mjs

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-sync-report
          path: instagram-sync-report.md
          if-no-files-found: ignore

      - name: Commit drafts, push branch, open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add src/content/posts
          if [ -d public/instagram ]; then
            git add public/instagram
          fi
          if git diff --cached --quiet; then
            echo "No new Instagram draft files."
            exit 0
          fi

          git commit -m "Add Instagram draft posts from @vinko (Ask-First)"
          git push -u origin instagram-drafts

          TITLE="Instagram drafts (Ask-First) — review before publish"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BODY_FILE=$(mktemp)
          {
            echo "Ask-First Instagram import for **@vinko**."
            echo
            echo "New posts are created with \`draft: true\`. **Do not merge as publish** until Vinko OK, then set \`draft: false\` on approved posts."
            echo
            echo "This PR does **not** deploy to www.vinko.com. GitHub Pages preview updates only after merge to \`${DEFAULT_BRANCH}\` *and* \`draft: false\`."
            echo
            if [ -f instagram-sync-report.md ]; then
              cat instagram-sync-report.md
            fi
            echo
            echo "See [docs/instagram-sync.md](docs/instagram-sync.md)."
          } > "$BODY_FILE"

          EXISTING="$(gh pr list --base "$DEFAULT_BRANCH" --head instagram-drafts --state open --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
            echo "Updated PR #${EXISTING}"
          else
            gh pr create --base "$DEFAULT_BRANCH" --head instagram-drafts --title "$TITLE" --body-file "$BODY_FILE"
          fi
